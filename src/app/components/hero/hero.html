
<section
  id="home"
  [attr.dir]="direction()"
  [attr.lang]="currentLang()"
  class="relative scroll-mt-20 overflow-hidden border-b border-gray-200/80
         bg-gradient-to-b from-white via-softblue-light/30 to-offwhite"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8
              py-12 sm:py-16 lg:py-24">

    <!-- Hero Layout -->
    <div class="flex flex-col lg:flex-row
                items-center gap-10 lg:gap-12">

      <!-- Hero Content -->
      <div class="w-full lg:w-1/2 flex flex-col
                  items-start gap-6">

        <!-- Heading -->
        <h1 class="text-3xl sm:text-4xl xl:text-6xl
                   font-extrabold text-navy leading-tight">

          <span class="block">
            {{ content().titleLine1 }}
          </span>

          <span class="block mt-2">
            {{ content().titleLine2 }}
          </span>

        </h1>

        <!-- Description -->
        <p class="text-base sm:text-lg lg:text-xl
                  text-gray-700 leading-relaxed max-w-2xl">

          {{ content().description }}

        </p>

        <!-- CTA Buttons -->
        <div class="flex flex-col sm:flex-row
                    items-stretch sm:items-center
                    gap-4 pt-2 w-full sm:w-auto">

          <!-- Primary CTA -->
          <a
            href="#specialists"
            class="hero-primary-btn"
          >
            {{ content().specialists }}

            <svg
              class="w-5 h-5 rtl:rotate-180"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M5 12h14m-7-7 7 7-7 7"
              />
            </svg>

          </a>

          <!-- Secondary CTA -->
          <a
            href="#articles"
            class="hero-secondary-btn"
          >
            {{ content().articles }}
          </a>

        </div>

      </div>

      <!-- Hero Image -->
      <div class="w-full lg:w-1/2 flex justify-center
                  items-center">

        <div class="relative w-full max-w-xl">

          <!-- Decorative Background -->
          <div class="absolute inset-5 rounded-full
                      bg-softblue-light/40 blur-3xl">
          </div>

          <!-- Main Image -->
          <img
            src="hero.png"
            [alt]="content().imageAlt"
            class="relative z-10 w-full h-auto
                   object-contain rounded-2xl
                   transition-transform duration-500
                   hover:scale-[1.02]"
          />

        </div>

      </div>

    </div>

  </div>
</section>
