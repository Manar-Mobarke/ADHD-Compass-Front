<section
  id="services"
  class="py-16 sm:py-20 bg-offwhite border-b border-gray-200"
  [attr.dir]="direction()"
  [attr.lang]="currentLang()"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- Section Header -->
    <div class="text-center max-w-3xl mx-auto mb-12 sm:mb-16">

      <div
        class="inline-flex items-center gap-2 px-3.5 py-1.5
        rounded-full bg-softblue-light text-navy
        font-bold text-xs mb-4 border border-softblue/30"
      >
        <span class="material-symbols-outlined text-sm">
          apps
        </span>

        {{ content().badge }}
      </div>

      <h2
        class="text-2xl sm:text-3xl lg:text-4xl
        font-extrabold text-navy mb-4"
      >
        {{ content().title }}
      </h2>

      <p class="text-base sm:text-lg text-gray-600 leading-relaxed">
        {{ content().description }}
      </p>

    </div>

    <!-- Services Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">

      @for (service of content().services; track service.icon) {

        <article
          class="p-6 sm:p-7 rounded-2xl bg-white
          border border-gray-200
          hover:border-turquoise hover:shadow-lg
          transition-all duration-300
          flex flex-col"
        >

          <!-- Service Icon -->
          <div
            class="w-12 h-12 rounded-xl
            bg-softblue-light text-turquoise
            flex items-center justify-center
            mb-5 border border-turquoise/20
            transition-transform duration-300
            hover:scale-110"
          >
            <span class="material-symbols-outlined text-2xl">
              {{ service.icon }}
            </span>
          </div>

          <!-- Service Content -->
          <h3 class="text-lg font-bold text-navy mb-3">
            {{ service.title }}
          </h3>

          <p class="text-sm sm:text-[15px] text-gray-700 leading-relaxed">
            {{ service.description }}
          </p>

        </article>

      }

    </div>

  </div>
</section>
